services:
  - type: web
    name: darshansetu-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: 5432
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://darshansetu-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://darshansetu-web.onrender.com

  - type: web
    name: darshansetu-ai
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: static
    name: darshansetu-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://darshansetu-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
